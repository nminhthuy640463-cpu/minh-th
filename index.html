<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Luyện Phát Âm Tiếng Trung</title>
    <style>
        :root { --main-color: #ff4757; --bg-color: #f1f2f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .btn { padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; font-size: 16px; margin: 10px; transition: 0.3s; }
        .btn-speak { background: var(--main-color); color: white; }
        #score { font-size: 24px; font-weight: bold; color: var(--main-color); margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Luyện Phát Âm HSK</h1>
    <select id="level">
        <option value="1">HSK 1</option>
        <option value="2">HSK 2</option>
        <option value="3">HSK 3</option>
    </select>
    <h2 id="word">你好 (Nǐ hǎo)</h2>
    <button class="btn" onclick="playAudio()">Nghe mẫu</button>
    <button class="btn btn-speak" onclick="startRecognition()">Bắt đầu nói</button>
    <div id="result"></div>
    <div id="score"></div>
</div>

<script>
    const wordDisplay = document.getElementById('word');
    
    // Sử dụng Web Speech API (tích hợp sẵn trong trình duyệt)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN'; // Ngôn ngữ tiếng Trung

    function playAudio() {
        const msg = new SpeechSynthesisUtterance(wordDisplay.innerText.split(' ')[0]);
        msg.lang = 'zh-CN';
        window.speechSynthesis.speak(msg);
    }

    function startRecognition() {
        recognition.start();
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('result').innerText = "Bạn đã nói: " + transcript;
            // Logic chấm điểm đơn giản
            const score = transcript.includes('你好') ? 100 : 50;
            document.getElementById('score').innerText = "Điểm của bạn: " + score;
        };
    }
</script>
</body>
</html>
